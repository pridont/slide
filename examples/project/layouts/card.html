<!--
  A custom layout. Every `<name>.html` in the directory named by `layouts:` in
  the project config becomes a layout a slide can ask for by that name.

  It supplies the inside of the slide; the <main> around it stays the tool's,
  so backgrounds, the aspect ratio and `class:` keep working.
-->
<div class="slide-content card-layout">
  <div class="card-layout__panel">{{content}}</div>
</div>
