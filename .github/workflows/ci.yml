name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A second push to the same branch makes the first one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from `packageManager` in package.json — with no
      # version in either place, the action refuses to guess one.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The example is the deck everything is verified against, so a build of
      # it failing is a failure worth hearing about on its own.
      - run: pnpm example:build
      # Every payload figure in the README comes from this script, and the
      # budgets are what stop one of them quietly becoming untrue. The deck of
      # diagrams is skipped here and named as skipped — drawing one needs a
      # browser, and downloading one costs more than the check is worth.
      - run: pnpm measure --check
      # The documentation site is built from docs/*.md by a script of its own,
      # and it can break on a missing title or a link to a page that is gone.
      # Cheaper to find out here than on a deploy.
      - run: pnpm run docs

  # There is no end-to-end job on purpose. `pnpm test:e2e` needs a Chromium
  # download and the system packages under it, which costs minutes per run
  # against about twenty seconds of actual testing. It is a local step:
  #
  #     pnpm exec playwright install chromium   # once
  #     pnpm test:e2e                           # before opening a pull request
  #
  # The same download is why nothing here builds examples/project, the only
  # deck with ```mermaid fences in it. `pnpm example:project:build` covers it
  # locally.

  commits:
    # Commit messages are what release-please reads to pick the next version
    # and write the changelog, so a message it cannot parse is a release note
    # that goes missing. Same rules as the local .githooks/commit-msg hook.
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint walks the range base..head, which needs the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Every commit on the branch
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # On a squash merge the pull request title is the commit message that
      # lands on main, and it is the one release-please will read. Passed
      # through the environment rather than interpolated into the script,
      # because a title is whatever someone typed.
      - name: The pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint --verbose
