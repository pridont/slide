name: Release Please

# Turns conventional commits into releases.
#
# Every push to main updates a standing "chore(main): release x.y.z" pull
# request holding the version bump and the CHANGELOG.md entries for everything
# merged since the last release. Merging that pull request is the release: it
# tags the commit, creates the GitHub release with those notes, and hands the
# tag to release.yml, which builds the tarball and attaches it.
#
# So: nothing is released by pushing, and a release is one merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two pushes in quick succession would otherwise race over the same release
# pull request. Not cancel-in-progress: a half-written release pull request is
# worse than a slow one.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: version and changelog
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only reached on the push that merged the release pull request, where
  # release-please has just created the tag and the release. It cannot be a tag
  # trigger: a tag pushed with GITHUB_TOKEN deliberately starts no workflow, so
  # the release has to be called rather than waited for.
  publish:
    name: attach the tarball
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
