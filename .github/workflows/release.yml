name: Release

# Builds the npm tarball for a tag and attaches it to that tag's GitHub
# release. That tarball is what `install.sh` downloads and what
# `npm install -g <url>` installs, so this workflow is the only thing standing
# between a tag and an installable CLI. Nothing here publishes to npm.
#
# Normally it is not run by hand: release-please.yml merges a release pull
# request, creates the tag and the release, and then calls this workflow. The
# tag push and dispatch triggers are the manual way back in when something
# needs re-cutting.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and attach assets to, e.g. v0.2.0'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release, e.g. v0.2.0'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: pack and publish
    runs-on: ubuntu-latest
    steps:
      # `inputs.tag` is set by both the dispatch and the reusable-workflow
      # call; on a tag push there is no input and the ref is the tag.
      - name: Work out the version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >>"$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >>"$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A broken release is worse than a late one.
      - run: pnpm check

      - run: pnpm build

      # The tag is the version. release-please has already committed the same
      # number to package.json, but stamping it here as well means a tag cut by
      # hand still produces a correctly versioned tarball.
      - name: Pack
        run: |
          npm pkg set version="$VERSION"
          npm pack --pack-destination artifacts
          # A stable filename as well as the versioned one, so
          # /releases/latest/download/slide.tgz is a URL that keeps working.
          cp "artifacts/slide-${VERSION}.tgz" artifacts/slide.tgz
          ls -l artifacts

      # Installing the actual artifact is the only check that means anything.
      - name: Smoke test
        run: |
          npm install -g "artifacts/slide-${VERSION}.tgz"
          slide --version
          slide init /tmp/smoke.md
          slide build /tmp/smoke.md --out /tmp/smoke-dist
          test -f /tmp/smoke-dist/index.html

      # release-please has usually created the release already, notes and all;
      # then this only uploads. The create branch is for a tag pushed by hand.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/slide-*.tgz artifacts/slide.tgz --clobber
          else
            gh release create "$TAG" artifacts/slide-*.tgz artifacts/slide.tgz \
              --title "$TAG" --generate-notes
          fi
